{% extends "base.html" %}
{% block content %}

<h2>Your Activity Logs</h2>

<div class="table-wrapper">
    <table>
        <tr>
            <th>Query</th>
            <th>Result</th>
            <th>Attack Type</th>
            <th>Confidence Score</th>
            <th>Date & Time</th>
        </tr>

        {% for log in logs %}
        <tr>
            <td>{{ log[0] }}</td>
            <td class="{{ 'safe' if 'Safe' in log[1] else 'danger' }}">
                {{ log[1] }}
            </td>
            <td>{{ log[2] }}</td>
            <td>{{ log[3] }}</td>
            <td>{{ log[4] }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
