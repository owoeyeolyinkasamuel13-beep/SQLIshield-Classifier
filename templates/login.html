<!DOCTYPE html>
<html>
<head>
    <title>Login - SQLShield Classifier</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <h1>SQLShield Classifier</h1>
        <p class="subtitle">Login to access the SQL injection detection and classification system</p>

        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}

        <form action="/login_user" method="post">
            <input name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p>No account? <a href="/register">Create one here</a></p>
    </div>
</div>

</body>
</html>
